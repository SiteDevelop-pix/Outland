        // Если было показано уведомление, но теперь окно расширилось - обновляем

          return;
        }

        // Для iOS та десктопу
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      function getKyivParts() {
        const formatter = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Kyiv',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = formatter.formatToParts(new Date());
        const values = {};
        parts.forEach((part) => {
          if (part.type !== 'literal') {
            values[part.type] = part.value;
          }
        });
        return {
          year: Number(values.year),
          month: Number(values.month),
          day: Number(values.day),
          hour: Number(values.hour),
          minute: Number(values.minute),
          second: Number(values.second)
        };
      }

      function getCurrentKyivDayName() {
        const { year, month, day } = getKyivParts();
        const utcDate = Date.UTC(year, month - 1, day);
        const jsDate = new Date(utcDate);
        return dayNames[(jsDate.getUTCDay() + 6) % 7] || 'Понеділок';
      }

      function getKyivMinutesNow() {
        const { hour, minute } = getKyivParts();
        return hour * 60 + minute;
      }

      function isWeekendNow() {
        return !dayNames.includes(getCurrentKyivDayName());
      }

      function getTimeMinutes(value) {
        const [hours, minutes] = value.split(':').map(Number);
        return hours * 60 + minutes;
      }

      function formatEndTime(startTime) {
        const endMinutes = getTimeMinutes(startTime) + lessonDuration;
        const hours = Math.floor(endMinutes / 60);
        const minutes = endMinutes % 60;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
      }

      function saveSelectedDay() {
        localStorage.setItem(STORAGE_KEYS.selectedDay, selectedDay);
      }

      function loadSelectedDay() {
        const currentDay = getCurrentKyivDayName();
        selectedDay = dayNames.includes(currentDay) ? currentDay : 'Понеділок';
        localStorage.setItem(STORAGE_KEYS.selectedDay, selectedDay);
      }

      function updateAdminUI() {
        document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
      }

      function showSecretPopup() {
        document.getElementById('secretPopup').classList.remove('hidden');
        document.getElementById('secretInput').value = '';
        setTimeout(() => document.getElementById('secretInput').focus(), 50);
      }

      function hideSecretPopup() {
        document.getElementById('secretPopup').classList.add('hidden');
      }

      function activateAdminMode() {
        isAdmin = true;
        localStorage.setItem(STORAGE_KEYS.adminMode, '1');
        updateAdminUI();
        hideSecretPopup();
      }

      function deactivateAdminMode() {
        isAdmin = false;
        localStorage.setItem(STORAGE_KEYS.adminMode, '0');
        updateAdminUI();
      }

      function handleSecretCommand(command) {
        const normalized = String(command || '').trim().toLowerCase();
        if (normalized === 'auth\\yono' || normalized === 'auth/yono') {
          activateAdminMode();
          return;
        }
        if (normalized.length) {
          alert('Невірна команда. Введіть auth\\yono');
        }
      }

      function renderDayButtons() {
        const daySwitcher = document.getElementById('daySwitcher');
        daySwitcher.innerHTML = '';

        if (isWeekendNow()) {
          daySwitcher.style.display = 'none';
          return;
        }

        daySwitcher.style.display = 'flex';

        dayNames.forEach((day) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `day-btn ${selectedDay === day ? 'active' : ''}`;
          btn.textContent = day;
          btn.addEventListener('click', () => {
            selectedDay = day;
            saveSelectedDay();
            refreshViews();
          });
          daySwitcher.appendChild(btn);
        });
      }

      function renderSubjects() {
        const subjectGrid = document.getElementById('subjectGrid');
        if (isWeekendNow()) {
          subjectGrid.innerHTML = '<div class="empty-state">Сьогодні вихідний, відпочивай..</div>';
          return;
        }

        const lessons = siteState.schedule[selectedDay] || [];
        const nowMinutes = getKyivMinutesNow();
        subjectGrid.innerHTML = '';

        lessons.forEach((lesson) => {
          const startMinutes = getTimeMinutes(lesson.time);
          const endMinutes = startMinutes + lessonDuration;

          if (lesson.subject === 'Інформатика') {
            const card = document.createElement('div');
            card.className = 'subject-btn subject-btn--split';
            card.style.setProperty('--progress', '0%');

            const isActiveNow = nowMinutes >= startMinutes && nowMinutes < endMinutes;
            const isPast = endMinutes <= nowMinutes;
            if (isActiveNow) {
              const elapsed = Math.max(0, nowMinutes - startMinutes);
              const progress = Math.min(100, Math.max(0, (elapsed / lessonDuration) * 100));
              card.style.setProperty('--progress', `${progress}%`);
              card.classList.add('active');
            } else if (isPast) {
              card.style.setProperty('--progress', '100%');
              card.classList.add('past');
            }

            const badge = document.createElement('span');
            badge.className = 'subject-number';
            badge.textContent = lesson.number;

            const content = document.createElement('div');
            content.className = 'subject-btn__content';

            const title = document.createElement('span');
            title.className = 'subject-btn__title';
            title.textContent = lesson.subject;

            const links = document.createElement('div');
            links.className = 'subject-btn__links';

            Object.entries(informaticsGroupLinks).forEach(([label, url]) => {
              const btn = document.createElement('a');
              btn.className = 'group-link';
              btn.href = url;
              btn.target = '_blank';
              btn.rel = 'noopener noreferrer';
              btn.textContent = label;
              btn.addEventListener('click', (event) => {
                event.preventDefault();
                window.open(url, '_blank', 'noopener,noreferrer');
              });
              links.appendChild(btn);
            });

            content.appendChild(title);
            content.appendChild(links);
            card.appendChild(badge);
            card.appendChild(content);
            subjectGrid.appendChild(card);
            return;
          }

          const link = document.createElement('a');
          link.className = 'subject-btn';

          const isActiveNow = nowMinutes >= startMinutes && nowMinutes < endMinutes;
          const isPast = endMinutes <= nowMinutes;

          if (isActiveNow) {
            const elapsed = Math.max(0, nowMinutes - startMinutes);
            const progress = Math.min(100, Math.max(0, (elapsed / lessonDuration) * 100));
            link.style.setProperty('--progress', `${progress}%`);
            link.classList.add('active');
          } else if (isPast) {
            link.style.setProperty('--progress', '100%');
            link.classList.add('past');
          } else {
            link.style.setProperty('--progress', '0%');
          }

          const meetUrl = subjectMeetMap[lesson.subject];
          if (meetUrl) {
            link.href = meetUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.addEventListener('click', (event) => {
              event.preventDefault();
              window.open(meetUrl, '_blank', 'noopener,noreferrer');
            });
          } else {
            link.href = 'javascript:void(0)';
            link.addEventListener('click', (event) => {
              event.preventDefault();
            });
          }

          const badge = document.createElement('span');
          badge.className = 'subject-number';
          badge.textContent = lesson.number;

          const label = document.createElement('span');
          label.textContent = lesson.subject;

          link.appendChild(badge);
          link.appendChild(label);
          subjectGrid.appendChild(link);
        });
      }

      function renderBooks() {
        const bookGrid = document.getElementById('bookGrid');
        bookGrid.innerHTML = '';

        // Show a single vertical list of all subjects (no day selection)
        const subjects = Object.keys(subjectPdfMap || defaultPdfMap || {});
        if (!subjects.length) {
          bookGrid.innerHTML = '<div class="empty-state">Підручники відсутні.</div>';
          return;
        }

        subjects.forEach((subject) => {
          const btn = document.createElement('a');
          btn.className = 'book-btn';
          btn.style.display = 'flex';
          btn.style.alignItems = 'center';
          btn.style.justifyContent = 'flex-start';
          btn.style.padding = '10px 12px';
          btn.style.width = '100%';
          const pdfUrl = (subjectPdfMap && subjectPdfMap[subject]) || (defaultPdfMap && defaultPdfMap[subject]) || '';
          if (pdfUrl) {
            btn.href = pdfUrl;
            btn.target = '_blank';
            btn.rel = 'noopener noreferrer';
            btn.addEventListener('click', (e) => {
              e.preventDefault();
              window.open(pdfUrl, '_blank', 'noopener,noreferrer');
            });
          } else {
            btn.href = 'javascript:void(0)';
            btn.classList.add('disabled');
            btn.addEventListener('click', (e) => e.preventDefault());
          }

          const label = document.createElement('div');
          label.textContent = subject;
          label.style.fontSize = '1rem';
          label.style.marginLeft = '6px';

          btn.appendChild(label);
          bookGrid.appendChild(btn);
        });
      }

      function renderSchedule() {
        const scheduleBody = document.getElementById('scheduleBody');
        const scheduleTitle = document.getElementById('scheduleTitle');

        if (isWeekendNow()) {
          scheduleTitle.textContent = 'Розклад';
          scheduleBody.innerHTML = '';
          return;
        }

        const lessons = siteState.schedule[selectedDay] || [];
        scheduleTitle.textContent = `Розклад · ${selectedDay}`;
        scheduleBody.innerHTML = '';

        lessons.forEach((lesson) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${lesson.number}</td>
            <td>${lesson.time} - ${formatEndTime(lesson.time)}</td>
            <td>${lesson.subject}</td>
          `;
          scheduleBody.appendChild(row);
        });
      }

      function getBlackClockIcon() {
        return `
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align: middle; display: inline-block; margin-right: 8px; fill: currentColor;">
            <path d="M12 2.75a9.25 9.25 0 1 1 0 18.5a9.25 9.25 0 0 1 0-18.5Zm0 1.5a7.75 7.75 0 1 0 0 15.5a7.75 7.75 0 0 0 0-15.5Zm-.72 3.75h1.44v4.66l3.22 2.13l-.72 1.24l-3.94-2.6V8Zm-1.45 9.1a.86.86 0 0 1 .86-.86h3.26a.86.86 0 0 1 0 1.72H11a.86.86 0 0 1-.86-.86Z"/>
          </svg>
        `;
      }

      function updateTodayCard() {
        const todayLabel = document.getElementById('todayLabel');
        const nextLessonLabel = document.getElementById('nextLessonLabel');
        const todayName = getCurrentKyivDayName();

        if (isWeekendNow()) {
          todayLabel.textContent = 'Вихідний';
          nextLessonLabel.textContent = '☕ Відпочивай';
          return;
        }

        todayLabel.textContent = todayName;
        const lessons = siteState.schedule[selectedDay] || [];
        const nowMinutes = getKyivMinutesNow();

        const activeLesson = lessons.find((lesson) => {
          const start = getTimeMinutes(lesson.time);
          const end = start + lessonDuration;
          return start <= nowMinutes && nowMinutes < end;
        });

        if (activeLesson) {
          nextLessonLabel.innerHTML = `${getBlackClockIcon()}${activeLesson.subject} ${activeLesson.time} - ${formatEndTime(activeLesson.time)}`;
          return;
        }

        const nextLesson = lessons.find((lesson) => nowMinutes < getTimeMinutes(lesson.time));
        if (nextLesson) {
          nextLessonLabel.innerHTML = `${getBlackClockIcon()}${nextLesson.subject} ${nextLesson.time}`;
          return;
        }

        nextLessonLabel.textContent = '✕ Немає уроків';
      }

      function refreshViews() {
        saveSelectedDay();
        document.querySelector('.title').textContent = siteState.pageTitle;
        document.querySelector('.subtitle').textContent = siteState.subtitle;
        document.title = siteState.pageTitle;
        renderDayButtons();
        renderSubjects();
        renderBooks();
        renderSchedule();
        updateTodayCard();
        // Keep day switcher hidden when Books panel is active (prevents Firebase updates from showing it)
        const daySwitcher = document.getElementById('daySwitcher');
        const activePanel = document.querySelector('.panel.active');
        if (daySwitcher) {
          daySwitcher.style.display = (activePanel && activePanel.id === 'books-panel') ? 'none' : '';
        }
      }

      function fillAdminForm() {
        document.getElementById('adminTitleInput').value = siteState.pageTitle;
        document.getElementById('adminSubtitleInput').value = siteState.subtitle;
        document.getElementById('adminScheduleInput').value = JSON.stringify(siteState.schedule, null, 2);
        document.getElementById('adminPdfInput').value = JSON.stringify(siteState.pdfs || subjectPdfMap, null, 2);
      }

      async function saveAdminChanges() {
        let schedule;
        let pdfs;
        try {
          schedule = JSON.parse(document.getElementById('adminScheduleInput').value);
          try {
            pdfs = JSON.parse(document.getElementById('adminPdfInput').value || '{}');
          } catch (e) {
            alert('Невірний JSON для підручників.');
            return;
          }
        } catch (error) {
          alert('Невірний JSON. Перевірте розклад.');
          return;
        }

        const nextState = {
          pageTitle: document.getElementById('adminTitleInput').value.trim() || 'Outland',
          subtitle: document.getElementById('adminSubtitleInput').value.trim() || '9-Г',
          schedule,
          pdfs: pdfs || {},
          updatedAt: Date.now()
        };

        siteState = nextState;
        await set(ref(db, 'site/content'), nextState);
      }

      async function resetAdminChanges() {
        siteState = {
          pageTitle: 'Outland',
          subtitle: '9-Г',
          schedule: clone(defaultSchedule),
          pdfs: JSON.parse(JSON.stringify(defaultPdfMap)),
          updatedAt: Date.now()
        };
        await set(ref(db, 'site/content'), siteState);
      }

      function updateDeviceList(devices) {
        const list = document.getElementById('deviceList');
        list.innerHTML = '';

        if (!devices || !Object.keys(devices).length) {
          list.innerHTML = '<li>Немає активних пристроїв</li>';
          return;
        }

        const activeDevices = Object.values(devices)
          .filter((device) => device && device.lastSeen && Date.now() - device.lastSeen < 45000)
          .sort((a, b) => b.lastSeen - a.lastSeen);

        if (!activeDevices.length) {
          list.innerHTML = '<li>Немає активних пристроїв</li>';
          return;
        }

        activeDevices.forEach((device) => {
          const item = document.createElement('li');
          const label = device.label || device.userAgent || 'браузер';
          const time = new Date(device.lastSeen).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
          item.textContent = `${label} • ${time}`;
          list.appendChild(item);
        });
      }

      function startPresence() {
        const clientId = crypto.randomUUID ? crypto.randomUUID() : `device-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const presenceRef = ref(db, `presence/${clientId}`);
        const payload = {
          label: navigator.platform || 'browser',
          userAgent: navigator.userAgent,
          lastSeen: Date.now()
        };

        set(presenceRef, payload);
        onDisconnect(presenceRef).remove();

        const heartbeat = setInterval(() => {
          set(presenceRef, { ...payload, lastSeen: Date.now() });
        }, 20000);

        window.addEventListener('beforeunload', () => {
          clearInterval(heartbeat);
          remove(presenceRef);
        });
      }

      function bindEvents() {
        tabs.forEach((tab) => {
          tab.addEventListener('click', () => {
            const target = tab.dataset.target;
            if (target) {
              tabs.forEach((item) => item.classList.toggle('active', item === tab));
              panels.forEach((panel) => panel.classList.toggle('active', panel.id === target));
              const daySwitcher = document.getElementById('daySwitcher');
              if (daySwitcher) {
                daySwitcher.style.display = (target === 'books-panel') ? 'none' : '';
              }
            }
          });
        });

        // Settings
        document.getElementById('settingsBtn').addEventListener('click', openSettings);
        document.getElementById('closeSettings').addEventListener('click', closeSettings);

        document.getElementById('darkModeToggle').addEventListener('change', toggleDarkMode);

        document.querySelectorAll('.color-option').forEach(el => {
          el.addEventListener('click', () => setAccentColor(el.dataset.color));
        });

        // Close settings when clicking outside
        document.addEventListener('click', (e) => {
          const settingsPanel = document.getElementById('settingsPanel');
          const settingsBtn = document.getElementById('settingsBtn');
          if (!settingsPanel.contains(e.target) && !settingsBtn.contains(e.target) && settingsPanel.classList.contains('show')) {
            closeSettings();
          }
        });

        document.getElementById('secretCancel').addEventListener('click', hideSecretPopup);
        document.getElementById('secretSubmit').addEventListener('click', () => {
          handleSecretCommand(document.getElementById('secretInput').value);
        });
        document.getElementById('secretInput').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') handleSecretCommand(event.target.value);
        });

        document.getElementById('closeAdminPanel').addEventListener('click', deactivateAdminMode);
        document.getElementById('saveAdminData').addEventListener('click', saveAdminChanges);
        document.getElementById('resetAdminData').addEventListener('click', resetAdminChanges);

        document.addEventListener('keydown', (event) => {
          if (event.key === 'ё' || event.key === '`' || event.key === '~') {
            event.preventDefault();
            showSecretPopup();
          }
        });
      }

      async function initDatabase() {
        try {
          const contentRef = ref(db, 'site/content');
          const snapshot = await get(contentRef);

          if (snapshot.exists()) {
            const data = snapshot.val();
            const subtitle = data.subtitle && data.subtitle.includes('10 школа') ? '9-Г' : (data.subtitle || '9-Г');
            const forcedSchedule = clone(defaultSchedule);
            siteState = {
              pageTitle: data.pageTitle || 'Outland',
              subtitle: subtitle,
              schedule: forcedSchedule,
              pdfs: data.pdfs || JSON.parse(JSON.stringify(defaultPdfMap))
            };
            const mergedPdfs = Object.assign({}, JSON.parse(JSON.stringify(defaultPdfMap)), siteState.pdfs || {});
            siteState.pdfs = mergedPdfs;
            subjectPdfMap = mergedPdfs;
            await set(contentRef, siteState);
          } else {
            await set(contentRef, siteState);
          }

          onValue(contentRef, (snapshotValue) => {
            if (!snapshotValue.exists()) return;
            const data = snapshotValue.val();
            const forcedSchedule = clone(defaultSchedule);
            siteState = {
              pageTitle: data.pageTitle || 'Outland',
              subtitle: data.subtitle || '9-Г',
              schedule: forcedSchedule,
              pdfs: data.pdfs || JSON.parse(JSON.stringify(defaultPdfMap))
            };
            const merged = Object.assign({}, JSON.parse(JSON.stringify(defaultPdfMap)), siteState.pdfs || {});
            siteState.pdfs = merged;
            subjectPdfMap = merged;
            fillAdminForm();
            refreshViews();
          });

          const presenceRef = ref(db, 'presence');
          onValue(presenceRef, (snapshotValue) => {
            updateDeviceList(snapshotValue.val() || {});
          });
        } catch (error) {
          console.error('Firebase init failed', error);
        }
      }

      loadSelectedDay();
      bindEvents();
      updateAdminUI();
      applySettings();
      updateSettingsUI();
      fillAdminForm();
      checkDesktopMode();
      initDatabase();
      startPresence();
      refreshViews();
      setInterval(refreshViews, 1000);

      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splashScreen');
          if (splash) {
            splash.classList.add('hidden');
          }
          document.body.classList.add('loaded');
        }, 1500);
      });
    </script>
  </body>
</html>
